# Local development stack: PostgreSQL + the Go API.
#
# Both published ports bind to 127.0.0.1, so nothing is reachable from the
# local network. The API reaches Postgres over the compose network on the `db`
# hostname; the database publish is only a convenience for psql.
#
#   printf 'POSTGRES_PASSWORD=%s\nJWT_SECRET=%s\n' \
#     "$(openssl rand -hex 16)" "$(openssl rand -hex 32)" > .env
#   docker compose up --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      # No default: compose refuses to start until this is set in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the container the listener must accept the Docker network; the
      # publish below is what keeps it off the local network.
      HOST: 0.0.0.0
      PORT: 8080
      DB_URI: postgres://tasks:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/tasks?sslmode=disable
      # Must be at least 32 characters; the server refuses to start otherwise.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      CORS_ORIGINS: http://localhost:3000
      # Optional: without it the AI suggestion endpoints are disabled by design.
      GEMINI_KEY: ${GEMINI_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
